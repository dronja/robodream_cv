# Realistic degradation for training (PR 2.1): blur -> resize -> noise -> JPEG, an optional
# second stage, rare grayscale (facehall.data.degrade). Initial values, to be tuned against the
# real-world test set in Phase 2 (DECISIONS.md, 2026-11-24, "Degradation pipeline").
# Blur sizes are in LR pixels; noise sigma is in 8-bit levels; probabilities are per sample;
# kind and mode values are relative sampling weights.
kind: pipeline
quantize: true
first:
  blur:
    prob: 0.9
    gaussian: 0.45
    anisotropic: 0.35
    motion: 0.1
    defocus: 0.1
    sigma: [0.1, 1.0]
    motion_length: [0.5, 3.0]
    defocus_radius: [0.3, 1.5]
  resize:
    bicubic: 0.4
    bilinear: 0.3
    area: 0.2
    nearest: 0.1
    antialias: 0.7          # bicubic and bilinear only
  noise:
    prob: 0.7
    gaussian: 0.6
    poisson: 0.4
    sigma: [1.0, 15.0]
    peak: [100.0, 3000.0]   # photons at white: 18 to 3.3 levels of noise at mid-grey
    gray: 0.4
  jpeg:
    prob: 0.8
    quality: [30, 95]
second:
  prob: 0.5
  size: [0.75, 2.0]         # the first stage ends at this multiple of the LR size
  stage:
    blur:
      prob: 0.5
      gaussian: 0.6
      anisotropic: 0.4
      sigma: [0.1, 0.6]
    resize:
      bicubic: 0.4
      bilinear: 0.3
      area: 0.2
      nearest: 0.1
      antialias: 0.7
    noise:
      prob: 0.5
      gaussian: 0.6
      poisson: 0.4
      sigma: [1.0, 10.0]
      peak: [300.0, 3000.0]
      gray: 0.4
    jpeg:
      prob: 0.8
      quality: [30, 95]
grayscale: 0.02             # the HR target is turned grey too
color_shift:                # off: an LR-only colour shift teaches the model to invent colours
  prob: 0.0
  shift: 0.0
