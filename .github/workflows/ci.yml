name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Keep the CPU-only environment created below: without this, `uv run`
      # would re-sync to the default (CUDA) PyTorch build.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (CPU-only PyTorch)
        run: uv sync --locked --extra cpu
      - name: Install ffmpeg (video tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  image:
    # The CPU service image (docker/Dockerfile.cpu, PR 5.4): built and checked end to end with a
    # tiny random model. The GPU image is not built here (4.6 GB, no GPU on the runner).
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (CPU-only PyTorch)
        run: uv sync --locked --extra cpu
      - name: Download the face detector (YuNet, 230 kB, pinned sha256)
        env:
          FACEHALL_WEIGHTS: ${{ runner.temp }}/weights
        run: uv run python scripts/download_weights.py yunet
      - name: Build the CPU image
        run: docker build -f docker/Dockerfile.cpu -t facehall:cpu .
      - name: Check the image end to end
        env:
          FACEHALL_WEIGHTS: ${{ runner.temp }}/weights
        run: uv run python scripts/smoke_image.py --image facehall:cpu --tiny
