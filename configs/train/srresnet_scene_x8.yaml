# The x8 reference recipe (srresnet_id_robust_x8, PR 3.4, D25) from the same start, on LR crops
# made like the inference pipeline's: the face is degraded as part of a larger scene and cut
# out by a warp at LR resolution (data.scene, Q15). Only the LR crops differ from the reference
# recipe. `best` is the last epoch.
# Not adopted: no variant met the D32 val rule (docs/DECISIONS.md, PR 4.3).
include:
  data: ../data/celeba_128.yaml
  degrade: ../degrade/realistic_x8.yaml
  model: ../model/srresnet.yaml
name: srresnet_scene_x8
scale: 8
seed: 0
data:
  scene:              # LR crops made like the inference pipeline's (PR 4.2, Q15)
    prob: 1.0
    shift: 0.5        # LR px: the face's sub-pixel position in the scene
    rotation: 10.0    # degrees
    scale: 0.25       # the face is 0.8-1.25 times the model input size in the scene
train:
  epochs: 2           # ~7 min on the RTX 6000 Ada (about 3.3 min per epoch)
  init: runs/srresnet_x8-20261125-095801/best.safetensors   # local run (PR 3.1)
  batch_size: 16
  loss: l1
  losses:
    pixel: 1.0
    identity: 0.1       # chosen on val among 0.1, 0.3, 1.0
  identity:
    weights: ${oc.env:FACEHALL_WEIGHTS,/mnt/storage/AI/Face/weights}/facenet_vggface2/20180402-114759-vggface2.pt
    crop_side: 0.875
    crop_center_y: 0.55
    jitter:
      shift: 0.05       # x the square side (5.6 px at 128): more than one period of the PR 3.3 grid
      rotation: 5.0     # degrees
      scale: 0.1
    blur: 1.0           # HR px: the largest sigma that keeps the val pair AUC within 0.005
  best_metric: none
  optimizer:
    name: adam
    lr: 1.0e-4
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
  scheduler:
    name: cosine
    min_lr: 1.0e-6
  ema_decay: 0.999
  precision: bf16
